name: Apply Arattai schema fix

on:
  push:
    branches:
      - fix/arattai-message-audit-flow
    paths:
      - arattai-schema-fix.patch.gz.b64

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply committed patch
        shell: bash
        run: |
          base64 --decode arattai-schema-fix.patch.gz.b64 | gzip --decompress > /tmp/arattai-schema-fix.patch
          git apply --index /tmp/arattai-schema-fix.patch
          rm -f arattai-schema-fix.patch.gz.b64 .github/workflows/apply-arattai-schema-fix.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Arattai payloads against live API schema"
          git push
