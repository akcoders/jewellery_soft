name: Apply Arattai patch

on:
  push:
    branches:
      - fix/arattai-message-audit-flow
    paths:
      - .arattai-change.patch.gz

permissions:
  contents: write

jobs:
  apply-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply committed patch
        shell: bash
        run: |
          gzip --decompress --stdout .arattai-change.patch.gz > /tmp/arattai-change.patch
          git apply --index /tmp/arattai-change.patch
          rm -f .arattai-change.patch.gz .github/workflows/apply-arattai-patch.yml
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Fix Arattai messaging and add delivery audit"
          git push
