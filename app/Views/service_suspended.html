<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#122c28">
  <title>Service suspended | Aabhushan ERP</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;min-height:100dvh;display:grid;place-items:center;padding:24px;background:#f4f1e9;color:#18332d;font:16px/1.65 system-ui,-apple-system,"Segoe UI",sans-serif}
    main{width:100%;max-width:560px;background:#fffdf8;border:1px solid #ded6c4;border-radius:20px;padding:48px 36px;text-align:center;box-shadow:0 16px 60px #17332d0d}
    .brand{font:600 28px/1.2 Georgia,serif;letter-spacing:2px}.erp{font-size:11px;letter-spacing:4px;color:#776949;margin-top:8px}.icon{margin:32px auto 20px;width:64px;height:64px;border:1px solid #d8bd7e;border-radius:50%;display:grid;place-items:center;color:#826321;font-size:32px}
    h1{font-size:clamp(26px,6vw,34px);line-height:1.2;margin:0 0 18px}p{margin:0;color:#626b64}.notice{margin-top:26px;border-top:1px solid #e8e2d5;padding-top:24px;font-size:14px}.label{display:inline-block;margin-top:28px;border:1px solid #e4d2af;background:#f8f0e1;color:#806025;border-radius:30px;padding:5px 14px;font-size:12px;letter-spacing:1px}
    @media(max-width:420px){main{padding:36px 22px}}
  </style>
</head>
<body>
  <main aria-labelledby="title">
    <div class="brand">AABHUSHAN</div><div class="erp">JEWELLERY ERP</div>
    <div class="icon" aria-hidden="true">&#9208;</div>
    <h1 id="title">Service suspended</h1>
    <p>Access to the application and website is currently suspended.</p>
    <p class="notice">Please contact your service provider to restore access.</p>
    <span class="label">ACCESS UNAVAILABLE</span>
  </main>
</body>
</html>
